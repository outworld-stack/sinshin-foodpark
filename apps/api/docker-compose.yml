# ─────────────────────────────────────────────────────────────────────────────
# apps/api — Layer 2: backend compose (can run standalone)
#
#   cd apps/api && docker compose up --build            # api + postgres + redis
#   cd apps/api && docker compose --profile dev up      # + hot-reload api-dev
#
# Topology:
#   sinshin_edge      (external)  ← Caddy / future LB see ONLY `api`
#   sinshin_internal  (private)   ← postgres & redis are NOT reachable from edge
# ─────────────────────────────────────────────────────────────────────────────
name: sinshin-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sinshin/api
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Tehran
    networks:
      - sinshin_edge
      - sinshin_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'const r = await fetch(\"http://127.0.0.1:3000/api/health\"); if (!r.ok) process.exit(1)'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Hot-reload API — same networks, direct port on localhost for debugging.
  api-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: sinshin/api:dev
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./drizzle:/app/drizzle
    env_file: .env
    environment:
      TZ: Asia/Tehran
      NODE_ENV: development
    ports:
      - "127.0.0.1:3010:3000"
    networks:
      sinshin_edge:
        aliases: ["api"] # Caddy target while the prod-like `api` is stopped
      sinshin_internal: {}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sinshin
      POSTGRES_PASSWORD: sinshin_local # local sim only — override on the server
      POSTGRES_DB: sinshin
      TZ: Asia/Tehran
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinshin -d sinshin"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - sinshin_internal

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - sinshin_internal

networks:
  sinshin_edge:
    name: sinshin_edge
    external: true
  sinshin_internal: {}

volumes:
  pg_data: {}
  redis_data: {}