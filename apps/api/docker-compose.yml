# ─────────────────────────────────────────────
#  apps/api/docker-compose.yml
#  اجرا فقط از ریشه‌ی پروژه و با یکی از این دو حالت:
#    DEV :  docker compose --profile dev  up -d --build
#    PROD:  docker compose --profile prod up -d --build
#  (بدون --profile فقط زیرساخت بالا می‌آید — استفاده نکن)
# ─────────────────────────────────────────────

services:
  # ── زیرساخت مشترک (در هر دو حالت روشن) ──

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── حالت production (فقط با --profile prod) ──

  api:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      DEVICE_ENFORCEMENT: "on"   # برای تست prod بدون محدودیت دستگاه، موقتاً «off» کن
    networks:
      - edge
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── حالت development (فقط با --profile dev) ──

  api-dev:
    profiles: ["dev"]
    image: oven/bun:1.2
    working_dir: /app
    command: sh -c "bun install && bun run dev"
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: development
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      DEVICE_ENFORCEMENT: "off"  # در dev محدودیت دستگاه غیرفعال است
    volumes:
      - .:/app
      - api_dev_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3010:3000"   # دسترسی مستقیم فقط از خود سیستم: http://localhost:3010
    networks:
      edge:
        aliases:
          - api                  # caddy در هر دو حالت به نام «api» وصل می‌شود
      internal: {}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
    name: sinshin_pg_data
  redis_data:
    name: sinshin_redis_data
  api_dev_node_modules:
    name: sinshin_api_dev_node_modules

networks:
  edge:
    name: sinshin_edge
    external: true
  internal:
    name: sinshin_internal
    internal: true