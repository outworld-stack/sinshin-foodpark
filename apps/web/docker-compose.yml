# ─────────────────────────────────────────────────────────────────────────────
# apps/web — Layer 2: frontend compose (can run standalone)
#
#   cd apps/web && docker compose --profile prod up --build   # runtime SSR server
#   cd apps/web && docker compose --profile dev up --build    # vite dev + HMR
#
# ⚠ `web` carries profile "prod" ON PURPOSE: services WITHOUT a profile are
#   started by EVERY `up` command — this profile is what keeps the two run
#   modes from ever running together.
#
# The dev container carries the `web` network alias — after
# `docker compose --profile prod stop` Caddy routes straight into the dev server.
# ─────────────────────────────────────────────────────────────────────────────
name: sinshin-web

services:
  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sinshin/web
    restart: unless-stopped
    environment:
      TZ: Asia/Tehran
      # SSR server port inside the container (nitro respects PORT/HOST)
      PORT: 3000
      HOST: 0.0.0.0
    networks:
      - sinshin_edge

  # Hot-reload dev server — source bind-mounted, no rebuild needed.
  web-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: sinshin/web:dev
    restart: unless-stopped
    # package.json pins --port 3001 for bare-metal dev; inside the
    # simulation everything speaks :3000 behind Caddy.
    command: bunx vite dev --host 0.0.0.0 --port 3000
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules # keep container-installed deps
    environment:
      TZ: Asia/Tehran
    ports:
      - "127.0.0.1:3011:3000" # direct access for debugging/HMR
    networks:
      sinshin_edge:
        aliases: ["web"] # Caddy target while the prod-like `web` is stopped

networks:
  sinshin_edge:
    name: sinshin_edge
    external: true

volumes:
  web_node_modules: